name: Daily Auto Read (3 accounts)

on:
  # 雲端機房 IP（Azure 20.x）過不了 Cloudflare：頁面標題空白＝被 CF 攔在門外，
  # cookie 再新也沒用（請求在 Discourse 看到 cookie 前就被擋）。
  # 已改用本機 Windows 工作排程「LinuxDo Auto Read」每日執行（住宅 IP 才過得了 CF）。
  # 排程已停用，避免每天產生假綠燈與假「登入失敗」通知。保留手動觸發供測試。
  # schedule:
  #   - cron: "0 10 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  auto-read:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      matrix:
        node-version: [20.x]

    env:
      USERNAMES: ${{ secrets.USERNAMES }}
      PASSWORDS: ${{ secrets.PASSWORDS }}
      COOKIES: ${{ secrets.COOKIES }}
      WEBSITE: "https://linux.do"
      RUN_TIME_LIMIT_MINUTES: "25"
      MAX_CONCURRENT_ACCOUNTS: "3"
      AUTO_LIKE: "true"
      HIDE_ACCOUNT_INFO: "true"
      SPECIFIC_USER: "14790897"
      HEALTH_PORT: "7860"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Run auto read
        env:
          # 偵測偽綠燈：跑完 25 分鐘若一個 cookie 都沒成功 refresh 就 exit 1
          FAIL_ON_NO_LOGIN: "true"
        run: node bypasscf.js
